<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>

  <!-- GitHub Cat Silhouette & Dice Hybrid Motif -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- GitHub Mark -->
    <path d="M0 -110 C-66 -110 -120 -56 -120 10 C-120 63 -85 107 -37 123 C-3 129 -8 116 -8 110 L-8 84 C-42 91 -49 68 -49 68 C-54 54 -62 50 -62 50 C-73 43 -61 43 -61 43 C-49 44 -42 56 -42 56 C-31 75 -13 70 -6 67 C-5 59 -2 54 2 50 C-25 47 -54 36 -54 -10 C-54 -23 -49 -34 -41 -43 C-42 -46 -46 -61 -40 -79 C-40 -79 -30 -82 -7 -67 C-17 -70 -2 -71 0 -71 C2 -71 17 -70 27 -67 C50 -82 60 -79 60 -79 C66 -61 62 -46 61 -43 C69 -34 74 -23 74 -10 C74 36 45 47 18 50 C23 54 27 63 27 75 L27 110 C27 116 22 129 27 123 C75 107 110 63 110 10 C110 -56 56 -110 0 -110 Z" 
          fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>

  <!-- Sparkle / Star 1 -->
  <path d="M 370 110 Q 370 140 400 140 Q 370 140 370 170 Q 370 140 340 140 Q 370 140 370 110 Z" fill="#fbbf24"/>
  <!-- Sparkle / Star 2 -->
  <path d="M 120 360 Q 120 380 140 380 Q 120 380 120 400 Q 120 380 100 380 Q 120 380 120 360 Z" fill="#38bdf8"/>
  <!-- Dice Overlay Badge -->
  <g transform="translate(360, 360)">
    <rect x="-45" y="-45" width="90" height="90" rx="22" fill="#1e293b" stroke="url(#glowGrad)" stroke-width="4"/>
    <circle cx="-20" cy="-20" r="7" fill="#fbbf24"/>
    <circle cx="20" cy="20" r="7" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
    <circle cx="-20" cy="20" r="7" fill="#fbbf24"/>
    <circle cx="20" cy="-20" r="7" fill="#fbbf24"/>
  </g>
</svg>
