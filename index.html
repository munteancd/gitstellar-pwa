<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitStellar - Random GitHub Repos (100+ Stele)</title>
  
  <!-- SEO & PWA Meta -->
  <meta name="description" content="Descoperă repozitorii GitHub populare și fascinante cu cel puțin 100 de stele, direct într-o aplicație web PWA ultra-rapidă.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom CSS System -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow-orb-1" aria-hidden="true"></div>
  <div class="bg-glow-orb-2" aria-hidden="true"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="#" class="brand" title="GitStellar Home">
        <img src="icon.svg" alt="GitStellar Logo" class="brand-icon">
        <span class="brand-title">GitStellar</span>
      </a>

      <div class="header-actions">
        <button id="installPwaBtn" class="btn-icon-secondary install-pwa-btn" title="Instalează aplicația PWA">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Instalează App
        </button>

        <button id="openBookmarksBtn" class="btn-icon-secondary" title="Vezi repozitoriile favorite">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          Favorite (<span id="bookmarkCount">0</span>)
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Body -->
  <main class="main-wrapper">
    
    <!-- Controls Filter Card -->
    <section class="filter-card" aria-label="Filtre căutare repozitorii">
      <div class="filter-group">
        <label for="minStarsSelect" class="filter-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          Minim Stele:
        </label>
        <select id="minStarsSelect" class="select-custom">
          <option value="100" selected>⭐ 100+ stele</option>
          <option value="500">⭐ 500+ stele</option>
          <option value="1000">🚀 1,000+ stele</option>
          <option value="5000">🔥 5,000+ stele</option>
          <option value="10000">👑 10,000+ stele</option>
          <option value="50000">🏆 50,000+ stele</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="languageSelect" class="filter-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          Limbaj:
        </label>
        <select id="languageSelect" class="select-custom">
          <option value="" selected>Toate limbajele</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="rust">Rust</option>
          <option value="go">Go</option>
          <option value="cpp">C++</option>
          <option value="java">Java</option>
          <option value="php">PHP</option>
          <option value="csharp">C#</option>
          <option value="swift">Swift</option>
          <option value="kotlin">Kotlin</option>
          <option value="html">HTML/CSS</option>
        </select>
      </div>
    </section>

    <!-- Discover Button Action -->
    <div class="action-banner">
      <button id="discoverBtn" class="btn-discover" title="Generează un repozitoriu GitHub aleatoriu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>Descoperă Repo Aleatoriu</span>
        <span class="shortcut-badge">Space / R</span>
      </button>
    </div>

    <!-- Active Repository Display Card -->
    <article id="repoCard" class="repo-card" aria-live="polite">
      <!-- Content populated dynamically by app.js -->
    </article>

  </main>

  <!-- Saved Bookmarks Modal / Drawer -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-drawer">
      <div class="drawer-header">
        <h2 class="drawer-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          Favorite Salvate
        </h2>
        <button id="closeBookmarksBtn" class="btn-close" aria-label="Închide sertarul de favorite">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div id="bookmarksList" class="drawer-content">
        <!-- Bookmark items injected via JS -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>GitStellar PWA &bull; Conectat direct la API-ul oficial GitHub</p>
  </footer>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
